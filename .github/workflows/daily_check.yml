name: Hotel Price Daily Monitor

on:
  schedule:
    # 毎朝 JST 08:00 (UTC 23:00 前日) に自動実行
    - cron: '0 23 * * *'
  workflow_dispatch: # GitHub UIからいつでも手動実行可能

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          TZ: 'Asia/Tokyo'
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Run Hotel Price Monitor
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          JALAN_API_KEY: ${{ secrets.JALAN_API_KEY }}
          TZ: 'Asia/Tokyo'
        run: |
          python main.py

      - name: Commit and push changes if results updated
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"

          git add docs/data.json history.json result.csv .geo_cache.json
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping git push."
          else
            echo "Results updated. Committing and pushing..."
            git pull --rebase origin main || true
            git commit -m "chore: update hotel monitor data [skip ci]"
            git push
          fi
